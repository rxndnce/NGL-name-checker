<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NGL NAME CHECKER</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #0b0b0d;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  color: #f0efe9;
}

/* background effects */
.noise, .scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.noise {
  opacity: 0.05;
  background: url("https://grainy-gradients.vercel.app/noise.svg");
}

.scanlines {
  background: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.03) 3px
  );
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: #ff2d55;
  filter: blur(120px);
  opacity: 0.15;
}

.glow1 { top: -120px; left: -120px; }
.glow2 { bottom: -120px; right: -120px; }

.container {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.terminal {
  width: 420px;
  padding: 35px;
  background: rgba(255,255,255,0.04);
  border: 1px solid #ff2d5550;
  backdrop-filter: blur(12px);
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 40px #ff2d5520;
  z-index: 2;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 3px;
  font-size: 28px;
  text-shadow: 0 0 15px #ff2d55;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid #ff2d5560;
  color: white;
  outline: none;
  border-radius: 12px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  background: #ff2d55;
  border: none;
  border-radius: 12px;
  color: white;
  font-family: 'Orbitron';
  cursor: pointer;
  box-shadow: 0 0 20px #ff2d55;
}

button:hover {
  transform: scale(1.02);
}

.result {
  margin-top: 20px;
  font-size: 18px;
}

.available { color: #00ff99; }
.taken { color: #ff2d55; }
.error { color: orange; }

.skull {
  width: 90px;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 10px #ff2d55);
}
</style>
</head>

<body>

<div class="noise"></div>
<div class="scanlines"></div>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">
  <div class="terminal">

    <img class="skull" src="https://i.imgur.com/3ZQ3ZQp.png" />

    <h1>BLOOD // BONE</h1>
    <p>NGL LINK SCANNER</p>

    <input id="username" placeholder="ENTER USERNAME" />
    <button onclick="check()">CHECK</button>

    <div id="result" class="result"></div>

  </div>
</div>

<script>
async function check() {
  const username = document.getElementById("username").value;
  const result = document.getElementById("result");

  if (!username) return;

  result.innerHTML = "SCANNING...";

  try {
    const res = await fetch(`/api/check?username=${username}`);
    const data = await res.json();

    if (data.status === "AVAILABLE") {
      result.className = "result available";
      result.innerHTML = "AVAILABLE";
    } else if (data.status === "TAKEN") {
      result.className = "result taken";
      result.innerHTML = "TAKEN";
    } else {
      result.className = "result error";
      result.innerHTML = "UNKNOWN";
    }

  } catch {
    result.className = "result error";
    result.innerHTML = "ERROR";
  }
}
</script>

</body>
</html>
